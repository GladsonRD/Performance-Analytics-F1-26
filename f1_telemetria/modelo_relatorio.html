      const x = (ci ? [0] : []).concat(vs.map(v => v.n)), y = (ci ? [ci[1]] : []).concat(vs.map(v => v.saldo_comb));
      const cd = (ci ? [['largada', ci[0].toFixed(2), '', '']] : []).concat(vs.map(v => [`fim da volta ${v.n}`, v.combustivel?.toFixed(2) ?? '', v.comb_gasto != null ? `gasto ${v.comb_gasto.toFixed(2)} kg · ` : '',
        v.saldo_delta != null ? (v.saldo_delta >= 0 ? `economizou ${v.saldo_delta.toFixed(2)}` : `gastou ${(-v.saldo_delta).toFixed(2)} a mais`) : '']));
      return [{ x, y, mode: 'lines+markers', line: { color: css('--s1'), width: 2 }, marker: { size: 7, color: css('--s1'), line: { color: css('--surface'), width: 2 } },
        customdata: cd, hovertemplate: '%{customdata[0]}: saldo %{y:+.2f} voltas<br>%{customdata[1]} kg no tanque<br>%{customdata[2]}%{customdata[3]}<extra></extra>' }];
    }, () => baseLayout({ yaxis: { title: { text: 'saldo (voltas)' }, zeroline: true, zerolinecolor: css('--axis') }, xaxis: { title: { text: 'volta (0 = largada)' }, dtick: 1 }, showlegend: false, shapes: scShapes() }));
  }
  if (minhas.some(v => v.ers_usado != null)) {
    const c = card(g, `<h3 style="margin:0 0 2px;font-size:15px">Energia (ERS) por volta</h3><p class="desc" style="margin-bottom:4px">Tudo em % da bateria (${M.bateria_mj} MJ). A bateria no fim da volta = início − usada + recuperada; por isso a usada pode passar de 100%.</p>`);
    const mj = p => p == null ? '' : (p * M.bateria_mj / 100).toFixed(2) + ' MJ';
    plot(div(c, 'grafico', 320), () => [
      { type: 'bar', x: xs, y: minhas.map(v => v.ers_inicio ?? null), name: 'bateria no início da volta', marker: { color: css('--s7') },
        customdata: minhas.map(v => mj(v.ers_inicio)), hovertemplate: 'início da volta: %{y:.0f}% (%{customdata})<extra>volta %{x}</extra>' },
      { type: 'bar', x: xs, y: minhas.map(v => v.ers_usado), name: 'usada', marker: { color: css('--s1') },
        customdata: minhas.map(v => [mj(v.ers_usado), v.ers_bateria]), hovertemplate: 'usada: %{y:.0f}% (%{customdata[0]})<br>sobrou no fim da volta: %{customdata[1]:.0f}%<extra>volta %{x}</extra>' },
      { type: 'bar', x: xs, y: minhas.map(v => v.ers_recuperado), name: 'recuperada', marker: { color: css('--s3') },
        customdata: minhas.map(v => mj(v.ers_recuperado)), hovertemplate: 'recuperada: %{y:.0f}% (%{customdata})<extra>volta %{x}</extra>' },
    ], () => baseLayout({ barmode: 'group', bargap: 0.3, bargroupgap: 0.08, yaxis: { title: { text: '% da bateria' }, rangemode: 'tozero', ticksuffix: '%' }, xaxis: { title: { text: 'volta' }, dtick: 1 } }));
  }
  energiaComparada(s);
  if (corrida) mapaDesgaste(s);
}

// ---------- corrida: onde cada piloto gasta mais pneu (mapa)
function mapaDesgaste(s) {
  const G = D.desgaste_trechos;
  if (!G || !G.carros || !Object.keys(G.carros).length) return;
  const TRS = D.tracos || [];
  const refDe = c => TRS.filter(t => String(t.carro) === String(c) && t.x && t.z).sort((a, b) => a.ms - b.ms)[0] || TRS.find(t => t.x && t.z);
  const carros = Object.keys(G.carros).sort((a, b) => (ehJog(b) - ehJog(a)) || ORDEM.indexOf(a) - ORDEM.indexOf(b));
  const c = card(s, `<h3 style="margin:0 0 2px;font-size:15px">Onde o pneu se gasta</h3>
    <p class="desc" style="margin:0 0 8px">Quanto o pneu se desgasta em cada trecho de ${G.passo} m da pista, somando todas as voltas da corrida (sem a 1ª volta e sem o box), em % de desgaste por km rodado naquele trecho. Quanto mais quente a cor, mais pneu se gasta ali. Clique num pneu do carro para ver só ele.</p>`);
  c.style.marginTop = '14px';
  const nomeComp = v => ({ 16: 'C5', 17: 'C4', 18: 'C3', 19: 'C2', 20: 'C1', 21: 'C0', 22: 'C6', 7: 'Inter', 8: 'Chuva' })[v] || String(v);
  const ctl = $(`<div class="linha-ctl">
    <label>Piloto<select class="dg-car">${carros.map(x => `<option value="${x}">${esc(ehJog(x) ? 'Você' : nome(x))}</option>`).join('')}</select></label>
    <label>Pneu<select class="dg-comp"></select></label>
    </div>`);
  c.appendChild(ctl);
  const selC = ctl.querySelector('.dg-car'), selP = ctl.querySelector('.dg-comp');
  const selR = { value: 't' };   // roda escolhida no desenho do carro ('t' = as quatro)
  const grade = $(`<div style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start" class="dom-grade"></div>`); c.appendChild(grade);
  const el = div(grade, 'grafico', 470);
  const lado = $('<div></div>'); grade.appendChild(lado);
  function opcoesComp() {
    const por = G.carros[selC.value] || {};
    const ks = Object.keys(por);
    const rot = k => { const v = por[k].vis; return PNEUS[v] ? `${PNEUS[v][1]} (${nomeComp(+k)})` : nomeComp(+k); };
    selP.innerHTML = (ks.length > 1 ? `<option value="">todos os pneus</option>` : '') + ks.map(k => `<option value="${k}">${rot(k)}</option>`).join('');
  }
  function soma() {
    const por = G.carros[selC.value] || {};
    const ks = selP.value ? [selP.value] : Object.keys(por);
    const nb = Math.max(...ks.map(k => por[k].m.length));
    const w = [0, 1, 2, 3].map(() => new Array(nb).fill(0)), m = new Array(nb).fill(0);
    ks.forEach(k => { const g = por[k]; for (let i = 0; i < g.m.length; i++) { m[i] += g.m[i]; for (let r = 0; r < 4; r++) w[r][i] += g.w[r][i]; } });
    return { w, m, nb };
  }
  function desenha() {
    const { w, m, nb } = soma();
    const rodas = selR.value === 't' ? [0, 1, 2, 3] : [+selR.value];
    const tot = Array.from({ length: nb }, (_, i) => rodas.reduce((a, r) => a + w[r][i], 0));
    const taxa = tot.map((x, i) => m[i] > 30 ? x / m[i] * 1000 : null);       // % por km
    const ref = refDe(selC.value);
    if (!ref) { lado.innerHTML = '<p class="fraco">Sem posição gravada para desenhar o mapa.</p>'; return; }
    const n = Math.min(ref.x.length, ref.z.length);
    const X = [], Y = [], C = [], H = [];
    for (let i = 0; i < n; i++) {
      const k = Math.min(nb - 1, Math.floor(i * M.passo / G.passo));
      X.push(ref.z[i]); Y.push(ref.x[i]); C.push(taxa[k]); H.push(`${Math.round(i * M.passo)} m · ${taxa[k] == null ? '—' : taxa[k].toFixed(2) + ' %/km'}`);
    }
    const vs = taxa.filter(v => v != null).sort((a, b) => a - b), cmax = vs.length ? vs[Math.floor(vs.length * 0.97)] : 1;
    const tr = [
      { x: X, y: Y, mode: 'lines', line: { color: css('--grid'), width: 12 }, hoverinfo: 'skip', showlegend: false },
      { x: X, y: Y, mode: 'markers', marker: { size: 7, color: C.map(v => v ?? 0), cmin: 0, cmax, colorscale: [[0, '#22c3e6'], [0.4, '#3ec46d'], [0.7, '#f2c12e'], [1, '#e8453c']],
        colorbar: { title: { text: '% por km', side: 'right' }, thickness: 10, len: 0.6, tickfont: { color: css('--muted'), size: 11 } } },
        text: H, hovertemplate: '%{text}<extra></extra>', showlegend: false },
      { x: [X[0]], y: [Y[0]], mode: 'markers', marker: { size: 11, color: css('--surface'), line: { color: css('--ink'), width: 2 } }, hovertemplate: 'largada<extra></extra>', showlegend: false },
    ];
    // números das curvas
    const ap = ((D.curvas || {}).apices || []).filter(i => i < n - 1);
    const span = Math.max(Math.max(...X) - Math.min(...X), Math.max(...Y) - Math.min(...Y));
    const nx = [], ny = [], nt = [];
    ap.forEach((i, k) => {
      const a = Math.max(0, i - 3), b = Math.min(n - 1, i + 3), tx = X[b] - X[a], ty = Y[b] - Y[a], tn = Math.hypot(tx, ty) || 1;
      const vira = Math.sign((X[i] - X[a]) * (Y[b] - Y[i]) - (Y[i] - Y[a]) * (X[b] - X[i])) || 1;
      nx.push(X[i] + ty / tn * vira * span * 0.045); ny.push(Y[i] - tx / tn * vira * span * 0.045); nt.push(String(k + 1));
    });
    tr.push({ x: nx, y: ny, mode: 'text', text: nt, textfont: { size: 11, color: css('--ink2') }, hoverinfo: 'skip', showlegend: false });
    Plotly.react(el, tr, baseLayout({ xaxis: { visible: false, scaleanchor: 'y' }, yaxis: { visible: false }, margin: { l: 10, r: 10, t: 10, b: 10 }, hovermode: 'closest', dragmode: 'pan' }), CFG);
    // por curva: divide a volta no meio entre os ápices
    const total = tot.reduce((a, b) => a + b, 0) || 1;
    const distAp = ap.map(i => i * M.passo), lim = distAp.map((d, k) => k ? (distAp[k - 1] + d) / 2 : 0);
    const zonas = distAp.map((d, k) => ({ k: k + 1, ini: lim[k], fim: k + 1 < distAp.length ? (d + distAp[k + 1]) / 2 : M.comprimento, w: 0, rodas: [0, 0, 0, 0] }));
    for (let i = 0; i < nb; i++) {
      const d = (i + 0.5) * G.passo, z = zonas.find(z => d >= z.ini && d < z.fim) || zonas[zonas.length - 1];
      if (!z) continue;
      z.w += tot[i]; for (let r = 0; r < 4; r++) z.rodas[r] += w[r][i];
    }
    const top = [...zonas].sort((a, b) => b.w - a.w).slice(0, 8);
    const NOME_R = ['traseiro esquerdo', 'traseiro direito', 'dianteiro esquerdo', 'dianteiro direito'];
    // participação de cada pneu no desgaste (todas as rodas), para pintar o carro
    const porRoda = [0, 1, 2, 3].map(r => w[r].reduce((a, b) => a + b, 0));
    const somaR = porRoda.reduce((a, b) => a + b, 0) || 1;
    const maxR = Math.max(...porRoda), minR = Math.min(...porRoda);
    const corRoda = r => { const f = maxR > minR ? (porRoda[r] - minR) / (maxR - minR) : 0;
      return f < 0.5 ? `color-mix(in srgb, #f2c12e ${Math.round(f * 200)}%, #3ec46d)` : `color-mix(in srgb, #e8453c ${Math.round((f - 0.5) * 200)}%, #f2c12e)`; };
    const sel = selR.value === 't' ? null : +selR.value;
    // desenho do carro visto de cima (nariz para a esquerda: a esquerda do piloto fica embaixo)
    const POS = { 3: [133, 22, 125, 70], 2: [133, 266, 125, 70], 1: [733, 22, 125, 71], 0: [733, 266, 125, 70] };
    const pneuSvg = r => { const [x, y, wd, h] = POS[r], baixo = y > 150;
      return `<g class="dg-pneu${sel === r ? ' sel' : ''}" data-r="${r}" style="cursor:pointer">
        <rect x="${x}" y="${y}" width="${wd}" height="${h}" rx="16" fill="${corRoda(r)}" fill-opacity="${sel == null || sel === r ? 0.75 : 0.3}"
          stroke="${sel === r ? 'var(--ink)' : corRoda(r)}" stroke-width="${sel === r ? 7 : 4}"/>
        <text x="${x + wd / 2}" y="${baixo ? y + h + 34 : y - 12}" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">${(porRoda[r] / somaR * 100).toFixed(0)}%</text></g>`; };
    const carro = `<svg viewBox="0 -48 1000 480" class="dg-carro" role="img" aria-label="carro visto de cima com o desgaste de cada pneu">
      <defs><mask id="mk-carro" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="377"><image href="${CARRO_IMG}" x="0" y="0" width="1000" height="377"/></mask></defs>
      <rect x="0" y="0" width="1000" height="377" fill="var(--ink2)" mask="url(#mk-carro)"/>
      ${[0, 1, 2, 3].map(pneuSvg).join('')}
      <text x="8" y="420" font-size="24" fill="var(--muted)">◀ frente</text></svg>`;
    lado.innerHTML = `<h4 style="margin:0 0 2px;font-size:13px">Pneus mais exigidos</h4>
      <p class="fraco" style="font-size:12px;margin:0 0 4px">Parte do desgaste total que ficou com cada pneu (verde = sofre menos, vermelho = sofre mais). Clique num pneu para ver no mapa e na lista onde ele mais se gasta.</p>
      ${carro}
      <div style="display:flex;align-items:center;gap:8px;margin:2px 0 12px;font-size:12px"><span class="fraco">${sel == null ? 'Mostrando os quatro pneus' : `Mostrando o pneu <b style="color:var(--ink)">${NOME_R[sel]}</b>`}</span>
        ${sel == null ? '' : '<button class="btn dg-todos" style="padding:2px 10px">ver os quatro</button>'}</div>
      <h4 style="margin:0 0 6px;font-size:13px">Curvas que mais gastam ${sel == null ? 'pneu' : 'o pneu ' + NOME_R[sel]}</h4>
      <table class="compacta" style="width:100%"><thead><tr><th>Trecho</th><th class="num">parte do desgaste</th></tr></thead><tbody>${top.map(z =>
        `<tr><td>curva ${z.k}</td><td class="num"><span class="barrinha" style="--p:${(z.w / top[0].w * 100).toFixed(0)}%"></span>${(z.w / total * 100).toFixed(0)}%</td></tr>`).join('')}</tbody></table>
      <p class="fraco" style="font-size:12px;margin-top:8px">Cada curva vai do meio da reta anterior até o meio da seguinte (inclui freada e saída).</p>`;
    lado.querySelectorAll('.dg-pneu').forEach(g => g.onclick = () => { const r = g.dataset.r; selR.value = selR.value === r ? 't' : r; desenha(); });
    const bt = lado.querySelector('.dg-todos'); if (bt) bt.onclick = () => { selR.value = 't'; desenha(); };
  }
  selC.onchange = () => { opcoesComp(); desenha(); }; selP.onchange = desenha;
  opcoesComp();
  desenhos.push(desenha);
}

// ---------- energia: você × outros pilotos (volta a volta)
function energiaComparada(s) {
  const E = D.energia_carros || {};
  const comDados = ORDEM.filter(c => E[c] && Object.keys(E[c]).length);
  if (comDados.length < 2) return;
  const c = card(s, `<h3 style="margin:0 0 2px;font-size:15px">Energia: comparar com outros pilotos</h3>
    <p class="desc" style="margin-bottom:6px">Em % da bateria (${M.bateria_mj} MJ), volta a volta. Escolha o que comparar e os pilotos.</p>`);
  c.style.marginTop = '14px';
  const ctl = $(`<div class="linha-ctl"><select><option value="usado">energia usada na volta</option><option value="recup">energia recuperada na volta</option>
    <option value="ini">bateria no início da volta</option><option value="fim">bateria no fim da volta</option><option value="saldo">recuperada − usada</option></select></div>`);
  c.appendChild(ctl);
  const selM = ctl.querySelector('select');
  const vizinho = comDados.find(x => !ehJog(x));
  let sel = [J, vizinho].filter(Boolean);
  const el = div(c, 'grafico', 330);
  const tab = $(`<div class="tab-scroll" style="margin-top:8px"></div>`); c.appendChild(tab);
  const pega = (e, m) => m === 'saldo' ? (e.recup != null ? +(e.recup - e.usado).toFixed(1) : null) : e[m] ?? null;
  function desenhar() {
    const m = selM.value;
    const tr = sel.filter(x => E[x]).map(x => {
      const vs = Object.keys(E[x]).map(Number).sort((a, b) => a - b);
      const cor = corPiloto(x, sel);
      return { x: vs, y: vs.map(v => pega(E[x][v], m)), mode: 'lines+markers', name: ehJog(x) ? 'Você' : nome(x), line: { color: cor, width: 2 },
        marker: { size: 7, color: cor, line: { color: css('--surface'), width: 2 } }, hovertemplate: `%{y:.0f}%<extra>${esc(ehJog(x) ? 'Você' : nome(x))} · volta %{x}</extra>` };
    });
    Plotly.react(el, tr, baseLayout({ yaxis: { title: { text: '% da bateria' }, ticksuffix: '%', zeroline: m === 'saldo', zerolinecolor: css('--axis') }, xaxis: { title: { text: 'volta' }, dtick: 1 }, hovermode: 'x unified' }), CFG);
    // médias
    const med = x => { const v = Object.values(E[x] || {}).map(e => pega(e, m)).filter(v => v != null); return v.length ? media(v) : null; };
    tab.innerHTML = `<table class="compacta"><thead><tr><th></th><th class="num">média</th><th class="num">voltas</th></tr></thead><tbody>${sel.map(x =>
      `<tr class="${ehJog(x) ? 'eu' : ''}"><td><span class="ponto" style="background:${corPiloto(x, sel)}"></span>${esc(ehJog(x) ? 'Você' : nome(x))}</td><td class="num">${med(x) == null ? '—' : med(x).toFixed(0) + '%'}</td><td class="num">${Object.keys(E[x] || {}).length}</td></tr>`).join('')}</tbody></table>`;
  }
  const picker = $('<div></div>'); ctl.prepend(picker);
  seletor(picker, { inicial: sel, aoMudar: x => { sel = x; desenhar(); } });
  selM.onchange = desenhar;
  desenhos.push(desenhar);
}

// ------------------------------------------------------------ eventos
{
  const s = sec('eventos', 'Eventos', corrida ? 'Punições, ultrapassagens envolvendo você, safety car, colisões e voltas mais rápidas.' : 'Punições, voltas mais rápidas e outros avisos da sessão.');
  const c = card(s);
  const fmtT = t => { const m = Math.floor(t / 60), ss = Math.floor(t % 60); return `${m}:${String(ss).padStart(2, '0')}`; };
  const itens = D.eventos.filter(e => {
    if (['OVTK', 'COLL'].includes(e.cod)) return ehJog(e.carro) || ehJog(e.outro);
    if (e.cod === 'PENA') return ehJog(e.carro) || corrida;
    return ['FTLP', 'SCAR', 'RTMT', 'RDFL', 'DTSV', 'SGSV', 'CHQF', 'LGOT', 'FLBK'].includes(e.cod);
  }).map(e => {
    let txt = e.nome;
    if (e.cod === 'OVTK') txt = ehJog(e.carro) ? `<span class="bom">Você passou ${esc(nome(e.outro))}</span>` : `<span class="ruim">${esc(nome(e.carro))} passou você</span>`;
    else if (e.cod === 'PENA') txt = `<b>${esc(nome(e.carro))}</b>: ${esc(e.texto)} — ${esc(e.motivo)}${e.tempo && e.tempo < 255 ? ` (${e.tempo} s)` : ''}${e.volta ? `, volta ${e.volta}` : ''}`;
    else if (e.cod === 'COLL') txt = `Colisão: ${esc(nome(e.carro))} × ${esc(nome(e.outro))}`;
    else if (e.cod === 'FTLP') txt = `Volta mais rápida: ${esc(nome(e.carro))} ${fmtVolta(Math.round(e.tempo * 1000))}`;
    else if (e.cod === 'SCAR') txt = esc(e.texto || 'Safety car');
    else if (e.cod === 'RTMT') txt = `Abandono: ${esc(nome(e.carro))}`;
    else if (e.cod === 'FLBK') txt = `Flashback (voltou para ${fmtT(e.para)})`;
    else if (e.carro != null) txt += ': ' + esc(nome(e.carro));
    return `<li${ehJog(e.carro) && e.cod === 'PENA' ? ' class="ruim"' : ''}><span class="t">${fmtT(e.t)}${corrida && e.volta_lider ? ` · V${e.volta_lider}` : ''}</span>${txt}</li>`;
  });
  c.appendChild(itens.length ? $(`<ul class="eventos">${itens.join('')}</ul>`) : $('<p class="fraco">Nenhum evento relevante.</p>'));
}

// ------------------------------------------------------------ desenhar
const desenhadas = new Set();
function desenharAba(id, forcar) {
  if (typeof Plotly === 'undefined') {
    document.querySelectorAll('.grafico').forEach(e => e.innerHTML = '<p class="fraco">Os gráficos precisam de internet para carregar a biblioteca Plotly.</p>');
    return;
  }
  if (desenhadas.has(id) && !forcar) {
    document.querySelectorAll(`section[data-aba="${id}"] .js-plotly-plot`).forEach(g => Plotly.Plots.resize(g));
    return;
  }
  desenhadas.add(id);
  desenhos.lista.filter(d => d.aba === id).forEach(d => d.f());
}
function mostrarAba(id) {
  if (!ABAS.find(a => a.id === id)) id = ABAS[0].id;
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('oculta', s.dataset.aba !== id));
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('ativa', b.dataset.aba === id));
  history.replaceState(null, '', '#' + id);
  desenharAba(id);
}
ABAS.forEach(a => { const b = $(`<button data-aba="${a.id}">${a.titulo}</button>`); b.onclick = () => { mostrarAba(a.id); window.scrollTo({ top: a.id === 'resumo' ? 0 : nav.offsetTop }); }; nav.appendChild(b); });
mostrarAba((location.hash || '#resumo').slice(1));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { const at = [...desenhadas]; desenhadas.clear(); at.forEach(id => { if (document.querySelector(`section[data-aba="${id}"]:not(.oculta)`)) desenharAba(id, true); }); });
</script>
